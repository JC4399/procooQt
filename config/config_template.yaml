server:
  # HTTP event server for event-driven automations. Bind localhost by default.
  host: "127.0.0.1"
  port: 12840

control_server:
  # HTTP control server used by external tools (e.g. the Obsidian plugin) to
  # create / open / delete sessions and windows. Bind localhost by default.
  host: "127.0.0.1"
  port: 12841
  # Accepted API keys; falls back to auth.api_keys when omitted. Empty disables auth.
  # api_keys: ["change-me"]

paths:
  # Relative to the procooQt project root (resolved against _PROJECT_ROOT in app.py).
  # Root capabilities library containing skills/ and automations/.
  capabilities_dir: "../capabilities"
  # Optional overrides for the two capability subdirectories.
  # skills_dir: "../capabilities/skills"
  # automations_dir: "../capabilities/automations"
  # Chat and session storage.
  storage_dir: "./storage"

auth:
  # API keys accepted by the event server (Authorization: Bearer <key> or X-Api-Key).
  api_keys: []

subagent:
  # Local HTTP bridge used by the optional `subagent` skill.
  enabled: true
  host: "127.0.0.1"
  port: 12842
  # Accepted API keys; falls back to auth.api_keys when omitted. Empty disables auth.
  # api_keys: ["change-me"]
  default_model: ""       # empty = the default llm entry
  max_concurrent: 4
  default_timeout: 900
  max_timeout: 3600
  max_records: 100

limits:
  max_chat_mb: 70
  max_chat_tokens: 0

agent:
  system_prompt: "You are a helpful assistant."
  summary_prompt: "The current chat is running too long. You are summarizing the conversation and create a summary for staring a new chat. Produce a concise but complete summary capturing: purpose and deliverables for current task, steps and progress, key facts, and decisions, actions taken with their results, and any open questions or next steps. The summary must be self-contained so a new conversation can continue seamlessly from it. Always include the full path of working folders, working files, and other important files to ensure all important information is passed down."

llm:
  - model_name: "qwen2.5"
    api_key: "ollama"
    api_base: "http://localhost:11434/v1"
    default: true
  # - model_name: "gpt-4o"
  #   api_key: "your-api-key"
  #   api_base: "https://api.openai.com/v1"
  #   default: false
